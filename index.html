<html>
    <head>
        <link rel="stylesheet" href="index.css">
         <link href="https://fonts.cdnfonts.com/css/cursed-timer-ulil" rel="stylesheet">
         <style>
            @import url('https://fonts.cdnfonts.com/css/cursed-timer-ulil');
         </style>       
    </head>
    <body>
        <main>
            <section class="scoreboard">
                <div id="scoreboard-ducks">
                    <h2>Ducks</h2>
                    <p class="score-text" id="score-ducks">0</p>
                    <div class="score-buttons">
                        <button class="score-button" id="score-ducks" onclick="addOneDucks()">Score</button>
                        <!-- <button class="score-button" id="add-2-home" onclick="addTwoHome()">+2</button> -->
                        <!-- <button class="score-button" id="add-3-home" onclick="addThreeHome()">+3</button> -->
                    </div>
                </div>
                <div id="scoreboard-rival">
                    <h2>Rival</h2>
                    <p class="score-text" id="score-rival">0</p>
                    <div class="score-buttons">
                        <button class="score-button" id="score-rival" onclick="addOneRival()">Score</button>
                        <!-- <button class="score-button" id="add-2-away" onclick="addTwoAway()">+2</button> -->
                        <!-- <button class="score-button" id="add-3-away" onclick="addThreeAway()">+3</button> -->
                    </div>
                </div>
            </section>
            <button id="reset-scores" onclick="resetScores()">Reset</button>
        </main>
        <script src="index.js"></script>
    </body>
</html>
